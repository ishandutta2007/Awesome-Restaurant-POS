<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316">
        <animate attributeName="stop-color" values="#f97316;#fbbf24;#ec4899;#f97316" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#ec4899">
        <animate attributeName="stop-color" values="#ec4899;#f97316;#8b5cf6;#ec4899" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#3b82f6;#fbbf24;#8b5cf6" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 54px; fill: url(#primaryGrad); }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #cbd5e1; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #f8fafc; }
    .neon-pulse { animation: pulse 3s ease-in-out infinite; }
    @keyframes pulse { 0% { opacity: 0.3; } 50% { opacity: 0.8; } 100% { opacity: 0.3; } }
  </style>

  <!-- Background -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="380" rx="16" fill="none" stroke="#312e81" stroke-width="2" />

  <!-- Grid decoration lines -->
  <g opacity="0.15" stroke="#6366f1" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="380" />
    <line x1="300" y1="0" x2="300" y2="380" />
    <line x1="500" y1="0" x2="500" y2="380" />
    <line x1="700" y1="0" x2="700" y2="380" />
    <line x1="900" y1="0" x2="900" y2="380" />
    <line x1="1100" y1="0" x2="1100" y2="380" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="280" x2="1200" y2="280" />
  </g>

  <!-- Dynamic Glowing Orbs -->
  <circle cx="150" cy="100" r="90" fill="#f97316" opacity="0.15" filter="url(#glow)">
    <animate attributeName="cy" values="100;130;100" dur="6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.12;0.25;0.12" dur="6s" repeatCount="indefinite" />
  </circle>
  <circle cx="1060" cy="260" r="110" fill="#8b5cf6" opacity="0.18" filter="url(#glow)">
    <animate attributeName="cy" values="260;230;260" dur="7s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.15;0.3;0.15" dur="7s" repeatCount="indefinite" />
  </circle>
  <circle cx="850" cy="90" r="65" fill="#ec4899" opacity="0.12" filter="url(#glow)">
    <animate attributeName="cx" values="850;880;850" dur="5s" repeatCount="indefinite" />
  </circle>

  <!-- Central Title & Subtitle -->
  <g transform="translate(600, 140)" text-anchor="middle">
    <!-- Icon / Badge -->
    <text y="-55" font-size="44">🍽️ ⚡ 💳 👨‍🍳</text>
    <text class="title" y="5">AWESOME RESTAURANT POS</text>
    <text class="subtitle" y="45">The Curated Point-of-Sale, KDS, Payments &amp; Hospitality Tech Directory</text>
    <text class="subtitle" y="75" font-size="16px" fill="#94a3b8">Cloud SaaS Platforms &amp; Self-Hostable Open-Source Systems</text>
  </g>

  <!-- Feature Badges Row -->
  <g transform="translate(150, 285)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="180" height="42" rx="21" fill="url(#badgeGrad)" stroke="#f97316" stroke-width="1.5" />
      <text class="badge-text" x="90" y="26" text-anchor="middle">🍕 POS Ecosystems</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(200, 0)">
      <rect width="190" height="42" rx="21" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-width="1.5" />
      <text class="badge-text" x="95" y="26" text-anchor="middle">🍳 Kitchen Display (KDS)</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(410, 0)">
      <rect width="160" height="42" rx="21" fill="url(#badgeGrad)" stroke="#ec4899" stroke-width="1.5" />
      <text class="badge-text" x="80" y="26" text-anchor="middle">💳 Payments &amp; QR</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(590, 0)">
      <rect width="170" height="42" rx="21" fill="url(#badgeGrad)" stroke="#10b981" stroke-width="1.5" />
      <text class="badge-text" x="85" y="26" text-anchor="middle">📦 Inventory &amp; ERP</text>
    </g>
    <!-- Pill 5 -->
    <g transform="translate(780, 0)">
      <rect width="120" height="42" rx="21" fill="url(#badgeGrad)" stroke="#a855f7" stroke-width="1.5" />
      <text class="badge-text" x="60" y="26" text-anchor="middle">⭐ 100% Free</text>
    </g>
  </g>
</svg>
